name: Gerar instalador da Calculadora (x64)
on:
  push:
    branches: [porcentagem-na-subtracao]
  workflow_dispatch:
jobs:
  build:
    name: Compilar e empacotar (x64)
    runs-on: windows-2025-vs2026
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
      name: Setup msbuild
    - uses: nuget/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2.0.2
      name: Use nuget 6.x
      with:
        nuget-version: '6.x'
    - run: |
        ./build/scripts/UpdateAppxManifestVersion.ps1 `
          -AppxManifest ./src/Calculator/Package.appxmanifest `
          -Version "0.${{ github.run_number }}.${{ github.run_attempt }}.0"
      shell: pwsh
      name: Definir versão do pacote
    - run: |
        msbuild ./src/Calculator.slnx `
          -restore `
          -p:RestorePackagesConfig=true `
          -p:OutDir=${{ github.workspace }}\output\ `
          -p:Platform=x64 `
          -p:Configuration=Release `
          -p:GenerateProjectSpecificOutputFolder=true `
          -maxCpuCount `
          -t:Publish `
          -p:PublishDir=${{ github.workspace }}\output\publish\
      shell: pwsh
      name: Compilar a Calculadora
    - run: |
        $dest = "${{ github.workspace }}\instalador-final"
        New-Item -ItemType Directory -Path $dest -Force | Out-Null
        $pkg = Get-ChildItem -Path "${{ github.workspace }}\output" -Recurse -Directory -Filter "Calculator_*_Test" | Where-Object { $_.Parent.Parent.Name -eq "Calculator" } | Select-Object -First 1
        if (-not $pkg) { Write-Error "Pasta do pacote (Calculator*_Test) não encontrada" -ErrorAction Stop }
        Copy-Item -Path $pkg.FullName -Destination "$dest\pacote" -Recurse
        Copy-Item ./build/scripts/SignTestApp.ps1 $dest
        Copy-Item ./instalador/instalar.ps1 $dest
        Copy-Item ./instalador/LEIA-ME.txt $dest
        Get-ChildItem -Recurse $dest | Select-Object FullName
      shell: pwsh
      name: Montar a pasta do instalador
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      name: Publicar instalador
      with:
        name: Calculadora-com-porcentagem-x64
        path: ${{ github.workspace }}/instalador-final
